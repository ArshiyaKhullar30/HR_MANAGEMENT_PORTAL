    why: "Auto matched 'Patient Representatives', a hospital admin role. This role sits in R&D at a pharma employer — the standard O*NET equivalent of a medical/scientific representative is technical-products sales."

  - role: Manager
    soc_code: "11-1021.00"
    occupation_title: General and Operations Managers
