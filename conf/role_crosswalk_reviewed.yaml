# ============================================================================
# Role -> O*NET SOC crosswalk — HUMAN-REVIEWED OVERRIDES  (Step 11, finding F4)
# ----------------------------------------------------------------------------
# This file always wins over conf/role_crosswalk_auto.yaml.
#
# Why it exists: the semantic matcher gets the obvious cases right (Database
# Administrators, Software Developers, Chief Executives) and some cases badly
# wrong — it mapped "CIO" to *Editors* at 0.21 confidence and "Senior BI
# Developer" to *Editors* at 0.36. Titles that are acronyms or internal
# shorthand carry almost no semantic signal, so every one of the 40 roles was
# checked by hand.
#
# Each entry records WHY, so a future reader can disagree with the reasoning
# rather than guess at it. Every SOC code below was verified to have both
# foundational and technical skill data attached.
#
# review_date: 2026-08-28
# reviewer: engineering lead
# roles_reviewed: 40 / 40
# ============================================================================
mappings:

  # ---- Population A — pharmaceutical / manufacturing ----------------------
  - role: Sales Executive
    soc_code: "41-4011.00"
    occupation_title: Sales Representatives, Wholesale and Manufacturing, Technical and Scientific Products
    why: "Auto matched 'Sales Managers' — wrong seniority. This is an individual-contributor sales role at a manufacturer, not a people manager."

  - role: Research Scientist
    soc_code: "19-1042.00"
    occupation_title: Medical Scientists, Except Epidemiologists
    why: "Sits in the Research & Development department of a pharmaceutical employer; Medical Scientists fits better than the generic 'Biological Scientists, All Other'."

  - role: Laboratory Technician
    soc_code: "29-2012.00"
    occupation_title: Medical and Clinical Laboratory Technicians
    why: "Auto matched 'Dental Laboratory Technicians' — a different industry entirely. R&D-department lab work maps to clinical lab technicians."

  - role: Manufacturing Director
    soc_code: "11-3051.00"
