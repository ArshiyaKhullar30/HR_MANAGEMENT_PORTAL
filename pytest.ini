[pytest]
testpaths = tests
pythonpath = . src
addopts =
    -q
    --strict-markers
    --cov=src/hrai
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    unit: fast, no I/O beyond fixtures
    integration: touches real data files or the API
    slow: model training or embedding downloads
